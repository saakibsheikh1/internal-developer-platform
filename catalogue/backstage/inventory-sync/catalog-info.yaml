apiVersion: backstage.io/v1alpha1
kind: Component

metadata:
  name: inventory-sync
  description: Scheduled inventory synchronization job
  tags:
    - aws
    - lambda
    - eventbridge
    - scheduled-job
  annotations:
    idp.io/deployment-status: active
  links:
    - url: https://example.com/runbooks/inventory-sync
      title: Runbook
      icon: docs
    - url: https://grafana.example.com/d/inventory-sync
      title: Grafana Dashboard
      icon: dashboard

spec:
  type: service
  lifecycle: production
  owner: inventory
  system: internal-developer-platform
  dependsOn:
    - resource:aws/lambda
    - resource:aws/eventbridge
