name: IDP Platform Onboarding

on:
  push:
    paths:
      - "onboarding/examples/platform.yaml"
      - "onboarding/schemas/platform.schema.json"
      - "governance/template-versions.yaml"
      - "templates/**"
      - "modules/**"
      - ".github/workflows/platform-onboarding.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

      config_file:
        description: "Platform configuration file"
        required: true
        type: string
        default: "onboarding/examples/platform.yaml"

permissions:
  id-token: write
  contents: write
  actions: read

concurrency:
  group: idp-platform-onboarding
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::495278513365:role/IDP-GitHubActions-Onboarding
  STATE_BUCKET: sakib-terraform-state-495278513365
  PLATFORM_ALERT_TOPIC_ARN: arn:aws:sns:ap-south-1:495278513365:idp-platform-alerts

jobs:

  # ============================================================
  # STAGE 3 - VALIDATE PLATFORM CONFIGURATION
  # ============================================================

  validate:
    name: Validate platform configuration
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate platform.yaml
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.config_file || 'onboarding/examples/platform.yaml' }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import yaml
          from jsonschema import validate

          config_file = os.environ["CONFIG_FILE"]

          print(f"Validating configuration: {config_file}")

          with open(config_file, "r", encoding="utf-8-sig") as f:
              config = yaml.safe_load(f)

          with open(
              "onboarding/schemas/platform.schema.json",
              "r",
              encoding="utf-8-sig"
          ) as f:
              schema = json.load(f)

          validate(instance=config, schema=schema)

          required = [
              "service_name",
              "template_type",
              "template_version",
              "team_name",
              "docker_image",
              "environment"
          ]

          for field in required:
              if not config.get(field):
                  print(f"ERROR: Missing required field: {field}")
                  sys.exit(1)

          print("Platform configuration is valid.")
          print(json.dumps(config, indent=2))
          PY

      - name: Validate approved golden-path template version
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.config_file || 'onboarding/examples/platform.yaml' }}
        run: |
          python - <<'PY'
          import os
          import sys
          import yaml

          config_file = os.environ["CONFIG_FILE"]

          with open(config_file, "r", encoding="utf-8-sig") as f:
              config = yaml.safe_load(f)

          with open(
              "governance/template-versions.yaml",
              "r",
              encoding="utf-8-sig"
          ) as f:
              governance = yaml.safe_load(f)

          template_type = config["template_type"]
          requested_version = str(config["template_version"])

          templates = governance.get("templates", {})

          if template_type not in templates:
              print(
                  f"ERROR: Template type '{template_type}' "
                  "is not registered in governance/template-versions.yaml."
              )
              sys.exit(1)

          approved = templates[template_type]

          approved_version = str(
              approved.get("version", "")
          )

          status = approved.get(
              "status",
              ""
          )

          expected_path = (
              f"templates/{template_type}"
          )

          configured_path = approved.get(
              "path",
              ""
          )

          print(
              f"Template type: {template_type}"
          )
          print(
              f"Requested version: {requested_version}"
          )
          print(
              f"Approved version: {approved_version}"
          )
          print(
              f"Governance status: {status}"
          )
          print(
              f"Governance path: {configured_path}"
          )

          if status != "approved":
              print(
                  "ERROR: Requested template is not approved."
              )
              sys.exit(1)

          if requested_version != approved_version:
              print(
                  "ERROR: Requested template version does "
                  "not match the approved version."
              )
              sys.exit(1)

          if configured_path != expected_path:
              print(
                  "ERROR: Governance template path does "
                  "not match the expected golden-path path."
              )
              sys.exit(1)

          print(
              "Approved golden-path template version verified."
          )

  # ============================================================
  # STAGE 3 - PLATFORM NETWORK BOOTSTRAP
  # ============================================================

  discover:
    name: Bootstrap platform network
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      vpc_id: ${{ steps.network.outputs.vpc_id }}
      vpc_cidr: ${{ steps.network.outputs.vpc_cidr }}
      private_subnet_ids: ${{ steps.network.outputs.private_subnet_ids }}
      public_subnet_ids: ${{ steps.network.outputs.public_subnet_ids }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: IDPPlatformBootstrap

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Terraform init
        working-directory: onboarding/platform-bootstrap
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=idp-onboarding/platform-bootstrap/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: onboarding/platform-bootstrap
        run: terraform validate

      - name: Terraform plan
        working-directory: onboarding/platform-bootstrap
        run: |
          terraform plan \
            -out=tfplan

      - name: Terraform apply
        working-directory: onboarding/platform-bootstrap
        run: |
          terraform apply \
            -auto-approve \
            tfplan

      - name: Export network outputs
        id: network
        working-directory: onboarding/platform-bootstrap
        shell: bash
        run: |
          VPC_ID=$(terraform output -raw vpc_id)
          VPC_CIDR=$(terraform output -raw vpc_cidr)

          PRIVATE_SUBNET_IDS=$(terraform output -json private_subnet_ids | jq -c '.')
          PUBLIC_SUBNET_IDS=$(terraform output -json public_subnet_ids | jq -c '.')

          echo "vpc_id=${VPC_ID}" >> "${GITHUB_OUTPUT}"
          echo "vpc_cidr=${VPC_CIDR}" >> "${GITHUB_OUTPUT}"
          echo "private_subnet_ids=${PRIVATE_SUBNET_IDS}" >> "${GITHUB_OUTPUT}"
          echo "public_subnet_ids=${PUBLIC_SUBNET_IDS}" >> "${GITHUB_OUTPUT}"

          echo "VPC: ${VPC_ID}"
          echo "Private subnets: ${PRIVATE_SUBNET_IDS}"
          echo "Public subnets: ${PUBLIC_SUBNET_IDS}"

  # ============================================================
  # STAGE 3 - AUTOMATED SERVICE ONBOARDING
  # ============================================================

  onboard:
    name: Onboard service
    needs:
      - validate
      - discover

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # AWS OIDC
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: IDPServiceOnboarding

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # ----------------------------------------------------------
      # Read platform.yaml
      # ----------------------------------------------------------

      - name: Read platform configuration
        id: config
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.config_file || 'onboarding/examples/platform.yaml' }}
        run: |
          python - <<'PY'
          import os
          import yaml

          config_file = os.environ["CONFIG_FILE"]

          with open(config_file, "r", encoding="utf-8-sig") as f:
              config = yaml.safe_load(f)

          required = [
              "service_name",
              "template_type",
              "template_version",
              "team_name",
              "docker_image",
              "environment"
          ]

          for field in required:
              if not config.get(field):
                  raise SystemExit(
                      f"Missing required field: {field}"
                  )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:

              for key in required:
                  output.write(
                      f"{key}={config[key]}\n"
                  )

          print("Configuration loaded:")

          for key in required:
              print(
                  f"{key}: {config[key]}"
              )
          PY

      # ----------------------------------------------------------
      # Validate governance again in onboarding job
      # ----------------------------------------------------------

      - name: Verify approved template governance
        shell: bash
        env:
          TEMPLATE_TYPE: ${{ steps.config.outputs.template_type }}
          TEMPLATE_VERSION: ${{ steps.config.outputs.template_version }}
        run: |
          python - <<'PY'
          import os
          import sys
          import yaml

          template_type = os.environ["TEMPLATE_TYPE"]
          requested_version = os.environ["TEMPLATE_VERSION"]

          with open(
              "governance/template-versions.yaml",
              "r",
              encoding="utf-8-sig"
          ) as f:
              governance = yaml.safe_load(f)

          templates = governance.get(
              "templates",
              {}
          )

          if template_type not in templates:
              print(
                  f"ERROR: Unsupported template: {template_type}"
              )
              sys.exit(1)

          approved = templates[
              template_type
          ]

          approved_version = str(
              approved.get("version", "")
          )

          status = approved.get(
              "status",
              ""
          )

          expected_path = (
              f"templates/{template_type}"
          )

          configured_path = approved.get(
              "path",
              ""
          )

          if status != "approved":
              print(
                  "ERROR: Template is not approved."
              )
              sys.exit(1)

          if requested_version != approved_version:
              print(
                  "ERROR: Template version mismatch."
              )
              sys.exit(1)

          if configured_path != expected_path:
              print(
                  "ERROR: Template path mismatch."
              )
              sys.exit(1)

          print(
              "Golden-path governance verification PASSED."
          )
          print(
              f"Template: {template_type}"
          )
          print(
              f"Version: {requested_version}"
          )
          PY

      # ----------------------------------------------------------
      # Install Cosign v3.1.3
      # ----------------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: "v3.1.3"

      # ----------------------------------------------------------
      # Verify installed Cosign version
      # ----------------------------------------------------------

      - name: Verify Cosign installation
        shell: bash
        run: |
          echo "Installed Cosign version:"
          cosign version

      # ----------------------------------------------------------
      # ECR authentication
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        shell: bash
        run: |
          aws ecr get-login-password \
            --region "${AWS_REGION}" \
            | docker login \
              --username AWS \
              --password-stdin \
              "495278513365.dkr.ecr.ap-south-1.amazonaws.com"

      # ----------------------------------------------------------
      # Verify Cosign signature
      # ----------------------------------------------------------

      - name: Verify signed container image
        shell: bash
        env:
          IMAGE: ${{ steps.config.outputs.docker_image }}
        run: |
          echo "============================================"
          echo "Resolving immutable image digest"
          echo "============================================"

          REGISTRY="${IMAGE%%/*}"
          IMAGE_PATH="${IMAGE#*/}"

          REPOSITORY="${IMAGE_PATH%%:*}"
          TAG="${IMAGE_PATH##*:}"

          echo "Registry: ${REGISTRY}"
          echo "Repository: ${REPOSITORY}"
          echo "Tag: ${TAG}"

          IMAGE_DIGEST=$(aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${REPOSITORY}" \
            --image-ids imageTag="${TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "None" ]; then
            echo "ERROR: Could not resolve image digest."
            exit 1
          fi

          IMAGE_WITH_DIGEST="${REGISTRY}/${REPOSITORY}@${IMAGE_DIGEST}"

          echo ""
          echo "Resolved immutable image:"
          echo "${IMAGE_WITH_DIGEST}"

          echo ""
          echo "============================================"
          echo "ECR image details"
          echo "============================================"

          aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${REPOSITORY}" \
            --image-ids imageDigest="${IMAGE_DIGEST}" \
            --query 'imageDetails[0].{Digest:imageDigest,Tags:imageTags,Size:imageSizeInBytes}' \
            --output json

          echo ""
          echo "============================================"
          echo "Cosign version"
          echo "============================================"

          cosign version

          echo ""
          echo "============================================"
          echo "Cosign public key"
          echo "============================================"

          if [ ! -f "./cosign.pub" ]; then
            echo "ERROR: cosign.pub was not found in repository."
            exit 1
          fi

          ls -l ./cosign.pub

          echo ""
          echo "============================================"
          echo "Cosign triangulate"
          echo "============================================"

          cosign triangulate "${IMAGE_WITH_DIGEST}" || true

          echo ""
          echo "============================================"
          echo "Verifying Cosign signature"
          echo "============================================"

          cosign verify \
            --key ./cosign.pub \
            "${IMAGE_WITH_DIGEST}"

          echo ""
          echo "============================================"
          echo "Cosign signature verification PASSED"
          echo "============================================"

      # ----------------------------------------------------------
      # Select Terraform template
      # ----------------------------------------------------------

      - name: Select Terraform template
        id: template
        shell: bash
        env:
          TEMPLATE_TYPE: ${{ steps.config.outputs.template_type }}
        run: |
          case "${TEMPLATE_TYPE}" in

            web-service)
              TEMPLATE_PATH="templates/web-service"
              ;;

            background-worker)
              TEMPLATE_PATH="templates/background-worker"
              ;;

            scheduled-job)
              TEMPLATE_PATH="templates/scheduled-job"
              ;;

            *)
              echo "ERROR: Unsupported template type: ${TEMPLATE_TYPE}"
              exit 1
              ;;

          esac

          echo "template_path=${TEMPLATE_PATH}" >> "${GITHUB_OUTPUT}"

          echo "Selected template:"
          echo "${TEMPLATE_PATH}"

      # ----------------------------------------------------------
      # Generate Terraform variables
      # ----------------------------------------------------------

      - name: Generate Terraform variables
        shell: bash
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          TEAM_NAME: ${{ steps.config.outputs.team_name }}
          DOCKER_IMAGE: ${{ steps.config.outputs.docker_image }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          TEMPLATE_VERSION: ${{ steps.config.outputs.template_version }}
          ALERT_EMAIL: ${{ secrets.IDP_ALERT_EMAIL }}
          VPC_ID: ${{ needs.discover.outputs.vpc_id }}
          PRIVATE_SUBNET_IDS: ${{ needs.discover.outputs.private_subnet_ids }}
          PUBLIC_SUBNET_IDS: ${{ needs.discover.outputs.public_subnet_ids }}
        run: |
          python - <<'PY'
          import json
          import os

          data = {
              "service_name": os.environ["SERVICE_NAME"],
              "team_name": os.environ["TEAM_NAME"],
              "docker_image": os.environ["DOCKER_IMAGE"],
              "environment": os.environ["ENVIRONMENT"],
              "template_version": os.environ["TEMPLATE_VERSION"],
              "alert_email": os.environ.get("ALERT_EMAIL", ""),
              "vpc_id": os.environ["VPC_ID"],
              "private_subnet_ids": json.loads(
                  os.environ["PRIVATE_SUBNET_IDS"]
              ),
              "public_subnet_ids": json.loads(
                  os.environ["PUBLIC_SUBNET_IDS"]
              )
          }

          with open(
              "generated.tfvars.json",
              "w"
          ) as f:
              json.dump(
                  data,
                  f,
                  indent=2
              )

          print(
              "Generated Terraform variables:"
          )

          print(
              json.dumps(
                  data,
                  indent=2
              )
          )
          PY

      # ----------------------------------------------------------
      # Terraform initialization
      # ----------------------------------------------------------

      - name: Terraform init
        working-directory: ${{ steps.template.outputs.template_path }}
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=idp-onboarding/${ENVIRONMENT}/${SERVICE_NAME}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      # ----------------------------------------------------------
      # Terraform validate
      # ----------------------------------------------------------

      - name: Terraform validate
        working-directory: ${{ steps.template.outputs.template_path }}
        run: |
          terraform validate

      # ----------------------------------------------------------
      # Copy generated variables
      # ----------------------------------------------------------

      - name: Prepare Terraform variables
        shell: bash
        run: |
          cp generated.tfvars.json \
            "${{ steps.template.outputs.template_path }}/generated.tfvars.json"

      # ----------------------------------------------------------
      # Terraform plan
      # ----------------------------------------------------------

      - name: Terraform plan
        working-directory: ${{ steps.template.outputs.template_path }}
        env:
          ACTION: ${{ inputs.action || 'apply' }}
        run: |

          if [ "${ACTION}" = "destroy" ]; then

            terraform plan \
              -destroy \
              -var-file="generated.tfvars.json" \
              -out=tfplan

          else

            terraform plan \
              -var-file="generated.tfvars.json" \
              -out=tfplan

          fi

      # ----------------------------------------------------------
      # Terraform apply
      # ----------------------------------------------------------

      - name: Terraform apply
        if: ${{ (inputs.action || 'apply') == 'apply' }}
        working-directory: ${{ steps.template.outputs.template_path }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan

      # ----------------------------------------------------------
      # Terraform destroy / offboarding
      # ----------------------------------------------------------

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ steps.template.outputs.template_path }}
        run: |
          terraform apply \
            -destroy \
            -auto-approve \
            tfplan

      # ----------------------------------------------------------
      # Generate Backstage catalogue entry
      # ----------------------------------------------------------

      - name: Generate catalogue entry
        if: ${{ (inputs.action || 'apply') == 'apply' }}
        shell: bash
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          TEAM_NAME: ${{ steps.config.outputs.team_name }}
          TEMPLATE_TYPE: ${{ steps.config.outputs.template_type }}
          TEMPLATE_VERSION: ${{ steps.config.outputs.template_version }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
        run: |

          mkdir -p \
            "catalogue/backstage/${SERVICE_NAME}"

          cat > \
            "catalogue/backstage/${SERVICE_NAME}/catalog-info.yaml" \
            <<EOF
          apiVersion: backstage.io/v1alpha1
          kind: Component

          metadata:
            name: ${SERVICE_NAME}

            description: ${SERVICE_NAME} managed by the Internal Developer Platform

            tags:
              - aws
              - ${TEMPLATE_TYPE}
              - ${ENVIRONMENT}

            annotations:
              idp/status: active
              idp/environment: ${ENVIRONMENT}
              idp/template-version: ${TEMPLATE_VERSION}
              backstage.io/techdocs-ref: dir:../../../docs/${SERVICE_NAME}

            links:
              - url: https://grafana.example.com/d/${SERVICE_NAME}
                title: Grafana Dashboard
                icon: dashboard

              - url: https://github.com/saakibsheikh1/internal-developer-platform
                title: Repository
                icon: github

          spec:
            type: service
            lifecycle: production
            owner: ${TEAM_NAME}
          EOF

      # ----------------------------------------------------------
      # Generate TechDocs
      # ----------------------------------------------------------

      - name: Generate TechDocs
        if: ${{ (inputs.action || 'apply') == 'apply' }}
        shell: bash
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          TEAM_NAME: ${{ steps.config.outputs.team_name }}
          TEMPLATE_TYPE: ${{ steps.config.outputs.template_type }}
          TEMPLATE_VERSION: ${{ steps.config.outputs.template_version }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
        run: |

          mkdir -p \
            "docs/${SERVICE_NAME}"

          cat > \
            "docs/${SERVICE_NAME}/index.md" \
            <<EOF
          # ${SERVICE_NAME}

          ## Service Overview

          - **Service:** ${SERVICE_NAME}
          - **Owner:** ${TEAM_NAME}
          - **Environment:** ${ENVIRONMENT}
          - **Template:** ${TEMPLATE_TYPE}
          - **Template Version:** ${TEMPLATE_VERSION}

          ## Platform

          This service was provisioned through the Internal Developer Platform.

          ## Golden Path Governance

          The service uses the approved golden-path template version
          ${TEMPLATE_VERSION}.

          ## Infrastructure

          Terraform infrastructure is provisioned through the selected
          golden-path template.

          ## Terraform State

          \`idp-onboarding/${ENVIRONMENT}/${SERVICE_NAME}/terraform.tfstate\`

          ## Monitoring

          Grafana dashboard:

          https://grafana.example.com/d/${SERVICE_NAME}

          ## Runbook

          1. Check ECS service health.
          2. Check CloudWatch alarms.
          3. Check application logs.
          4. Check ALB target health where applicable.
          5. Verify the container image and deployment status.

          ## Security

          Container images are required to pass Cosign signature verification
          before Terraform provisioning proceeds.
          EOF

      # ----------------------------------------------------------
      # Generate Grafana dashboard definition
      # ----------------------------------------------------------

      - name: Generate Grafana dashboard definition
        if: ${{ (inputs.action || 'apply') == 'apply' }}
        shell: bash
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          TEMPLATE_VERSION: ${{ steps.config.outputs.template_version }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          TEAM_NAME: ${{ steps.config.outputs.team_name }}
        run: |

          mkdir -p monitoring/grafana

          cat > \
            "monitoring/grafana/${SERVICE_NAME}.json" \
            <<EOF
          {
            "dashboard": {
              "title": "${SERVICE_NAME} - Platform Dashboard",
              "uid": "${SERVICE_NAME}",

              "tags": [
                "idp",
                "${ENVIRONMENT}",
                "${TEAM_NAME}",
                "template-v${TEMPLATE_VERSION}"
              ],

              "timezone": "browser",

              "panels": [
                {
                  "type": "timeseries",
                  "title": "Request Rate",
                  "targets": []
                },
                {
                  "type": "timeseries",
                  "title": "Error Rate",
                  "targets": []
                },
                {
                  "type": "timeseries",
                  "title": "Latency",
                  "targets": []
                },
                {
                  "type": "timeseries",
                  "title": "Resource Utilization",
                  "targets": []
                }
              ]
            }
          }
          EOF

      # ----------------------------------------------------------
      # SNS onboarding summary
      # ----------------------------------------------------------

      - name: Publish onboarding summary
        if: ${{ always() }}
        shell: bash
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          TEAM_NAME: ${{ steps.config.outputs.team_name }}
          TEMPLATE_TYPE: ${{ steps.config.outputs.template_type }}
          TEMPLATE_VERSION: ${{ steps.config.outputs.template_version }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          ACTION: ${{ inputs.action || 'apply' }}
        run: |

          TOPIC_NAME="idp-onboarding-summary"

          TOPIC_ARN=$(aws sns create-topic \
            --name "${TOPIC_NAME}" \
            --region "${AWS_REGION}" \
            --query TopicArn \
            --output text)

          MESSAGE="IDP Platform Onboarding Summary

          Service: ${SERVICE_NAME}
          Team: ${TEAM_NAME}
          Template: ${TEMPLATE_TYPE}
          Template Version: ${TEMPLATE_VERSION}
          Environment: ${ENVIRONMENT}
          Action: ${ACTION}
          Repository: saakibsheikh1/internal-developer-platform
          Workflow: ${GITHUB_RUN_ID}

          Terraform onboarding workflow completed."

          aws sns publish \
            --topic-arn "${TOPIC_ARN}" \
            --message "${MESSAGE}" \
            --region "${AWS_REGION}"

      # ----------------------------------------------------------
      # STAGE 5 - ONBOARDING FAILURE ALERT
      # ----------------------------------------------------------

      - name: Publish onboarding pipeline failure alert
        if: ${{ failure() }}
        shell: bash
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name || 'unknown-service' }}
          TEAM_NAME: ${{ steps.config.outputs.team_name || 'unknown-team' }}
          TEMPLATE_TYPE: ${{ steps.config.outputs.template_type || 'unknown-template' }}
          TEMPLATE_VERSION: ${{ steps.config.outputs.template_version || 'unknown-version' }}
          CONFIG_FILE: ${{ inputs.config_file || 'onboarding/examples/platform.yaml' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Preparing Stage 5 onboarding failure alert."

          FAILED_STEP="Unknown failed step"

          JOB_DATA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")

          FAILED_STEP=$(echo "${JOB_DATA}" | jq -r '
            .jobs[]
            | select(.name == "Onboard service")
            | .steps[]
            | select(.conclusion == "failure")
            | .name
          ' | head -n 1)

          if [ -z "${FAILED_STEP}" ] || [ "${FAILED_STEP}" = "null" ]; then
            FAILED_STEP="Unknown failed step"
          fi

          echo "Service: ${SERVICE_NAME}"
          echo "Team: ${TEAM_NAME}"
          echo "Failed step: ${FAILED_STEP}"

          FAILURE_MESSAGE="IDP ONBOARDING PIPELINE FAILURE

          Service: ${SERVICE_NAME}
          Team: ${TEAM_NAME}
          Template: ${TEMPLATE_TYPE}
          Template Version: ${TEMPLATE_VERSION}
          Environment: ${ENVIRONMENT:-unknown}
          Failed Step: ${FAILED_STEP}
          Repository: ${GITHUB_REPOSITORY}
          Workflow Run: ${GITHUB_RUN_ID}
          Workflow URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Action required: investigate the failed onboarding step."

          aws sns publish \
            --topic-arn "${PLATFORM_ALERT_TOPIC_ARN}" \
            --subject "IDP Onboarding Failure: ${SERVICE_NAME}" \
            --message "${FAILURE_MESSAGE}" \
            --region "${AWS_REGION}"

          aws cloudwatch put-metric-data \
            --namespace "IDP/Platform" \
            --metric-data "MetricName=OnboardingPipelineFailure,Dimensions=[{Name=ServiceName,Value=${SERVICE_NAME}},{Name=FailureStep,Value=${FAILED_STEP}}],Value=1,Unit=Count" \
            --region "${AWS_REGION}"

          echo "Stage 5 onboarding failure alert published."

      # ----------------------------------------------------------
      # Commit catalogue / TechDocs / Grafana
      # ----------------------------------------------------------

      - name: Commit catalogue and platform artifacts
        if: ${{ (inputs.action || 'apply') == 'apply' }}
        shell: bash
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "catalogue/backstage/${SERVICE_NAME}" \
            "docs/${SERVICE_NAME}" \
            "monitoring/grafana/${SERVICE_NAME}.json"

          if git diff --cached --quiet; then

            echo "No catalogue/dashboard changes to commit."

          else

            git commit \
              -m "chore(idp): onboard ${SERVICE_NAME}"

            git push

          fi

      # ----------------------------------------------------------
      # GitHub Actions summary
      # ----------------------------------------------------------

      - name: Publish GitHub Actions summary
        if: always()
        shell: bash
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          TEAM_NAME: ${{ steps.config.outputs.team_name }}
          TEMPLATE_TYPE: ${{ steps.config.outputs.template_type }}
          TEMPLATE_VERSION: ${{ steps.config.outputs.template_version }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          ACTION: ${{ inputs.action || 'apply' }}
        run: |

          {
            echo "# IDP Platform Onboarding"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Service | ${SERVICE_NAME} |"
            echo "| Team | ${TEAM_NAME} |"
            echo "| Template | ${TEMPLATE_TYPE} |"
            echo "| Template Version | ${TEMPLATE_VERSION} |"
            echo "| Environment | ${ENVIRONMENT} |"
            echo "| Action | ${ACTION} |"
            echo "| AWS Region | ${AWS_REGION} |"
            echo "| Terraform State | idp-onboarding/${ENVIRONMENT}/${SERVICE_NAME}/terraform.tfstate |"
            echo "| Grafana | https://grafana.example.com/d/${SERVICE_NAME} |"
            echo
            echo "## Security"
            echo
            echo "- ECR authentication: enabled"
            echo "- Cosign image verification: enabled"
            echo "- Immutable image digest verification: enabled"
            echo "- GitHub OIDC authentication: enabled"
            echo
            echo "## Platform"
            echo
            echo "- Self-service configuration: platform.yaml"
            echo "- Terraform template selection: enabled"
            echo "- Catalogue-as-code: enabled"
            echo "- TechDocs: enabled"
            echo "- Grafana dashboard definition: generated"
            echo "- SNS summary: enabled"
            echo "- Onboarding failure alert: enabled"
            echo "- Terraform offboarding: enabled"
            echo "- Golden-path template governance: enabled"
          } >> "${GITHUB_STEP_SUMMARY}"