name: Platform Service Onboarding

on:
  workflow_dispatch:
  push:
    paths:
      - "onboarding/examples/platform.yaml"
      - "onboarding/schemas/platform.schema.json"
      - "templates/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::495278513365:role/IDP-GitHubActions-Onboarding

jobs:
  validate:
    name: Validate Platform Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate platform.yaml
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml
          from jsonschema import validate

          config_path = Path("onboarding/examples/platform.yaml")
          schema_path = Path("onboarding/schemas/platform.schema.json")

          config = yaml.safe_load(config_path.read_text())
          schema = json.loads(schema_path.read_text())

          validate(instance=config, schema=schema)

          print("Platform configuration is valid.")
          print(json.dumps(config, indent=2))
          PY

  discover:
    name: Discover Platform Infrastructure
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      vpc_id: ${{ steps.network.outputs.vpc_id }}
      private_subnets: ${{ steps.network.outputs.private_subnets }}
      public_subnets: ${{ steps.network.outputs.public_subnets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover IDP network
        id: network
        shell: bash
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters \
              "Name=tag:ManagedBy,Values=IDP" \
              "Name=tag:Environment,Values=dev" \
            --query 'Vpcs[0].VpcId' \
            --output text)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "No IDP development VPC found."
            exit 1
          fi

          PRIVATE_SUBNETS=$(aws ec2 describe-subnets \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=tag:ManagedBy,Values=IDP" \
              "Name=tag:Tier,Values=private" \
            --query 'Subnets[].SubnetId' \
            --output text | tr '\t' ',')

          PUBLIC_SUBNETS=$(aws ec2 describe-subnets \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=tag:ManagedBy,Values=IDP" \
              "Name=tag:Tier,Values=public" \
            --query 'Subnets[].SubnetId' \
            --output text | tr '\t' ',')

          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "private_subnets=$PRIVATE_SUBNETS" >> "$GITHUB_OUTPUT"
          echo "public_subnets=$PUBLIC_SUBNETS" >> "$GITHUB_OUTPUT"

          echo "VPC: $VPC_ID"
          echo "Private subnets: $PRIVATE_SUBNETS"
          echo "Public subnets: $PUBLIC_SUBNETS"

  onboard:
    name: Provision Service
    runs-on: ubuntu-latest
    needs: [validate, discover]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml

      - name: Read platform configuration
        id: config
        shell: bash
        run: |
          SERVICE_NAME=$(python3 -c "import yaml; print(yaml.safe_load(open('onboarding/examples/platform.yaml'))['service_name'])")
          TEMPLATE_TYPE=$(python3 -c "import yaml; print(yaml.safe_load(open('onboarding/examples/platform.yaml'))['template_type'])")
          TEAM_NAME=$(python3 -c "import yaml; print(yaml.safe_load(open('onboarding/examples/platform.yaml'))['team_name'])")
          DOCKER_IMAGE=$(python3 -c "import yaml; print(yaml.safe_load(open('onboarding/examples/platform.yaml'))['docker_image'])")
          ENVIRONMENT=$(python3 -c "import yaml; print(yaml.safe_load(open('onboarding/examples/platform.yaml'))['environment'])")

          echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "template_type=$TEMPLATE_TYPE" >> "$GITHUB_OUTPUT"
          echo "team_name=$TEAM_NAME" >> "$GITHUB_OUTPUT"
          echo "docker_image=$DOCKER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin \
              "$(echo '${{ steps.config.outputs.docker_image }}' | cut -d/ -f1)"

      - name: Verify Cosign image signature
        env:
          IMAGE: ${{ steps.config.outputs.docker_image }}
        run: |
          cosign verify \
            --key ./cosign.pub \
            "$IMAGE"

      - name: Select Terraform template
        id: template
        shell: bash
        run: |
          case "${{ steps.config.outputs.template_type }}" in
            web-service)
              echo "template=templates/web-service" >> "$GITHUB_OUTPUT"
              ;;
            background-worker)
              echo "template=templates/background-worker" >> "$GITHUB_OUTPUT"
              ;;
            scheduled-job)
              echo "template=templates/scheduled-job" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported template type."
              exit 1
              ;;
          esac

      - name: Generate Terraform variables
        shell: bash
        run: |
          TEMPLATE="${{ steps.template.outputs.template }}"

          cat > "$TEMPLATE/terraform.tfvars" <<EOF
          service_name = "${{ steps.config.outputs.service_name }}"
          job_name = "${{ steps.config.outputs.service_name }}"
          team_name = "${{ steps.config.outputs.team_name }}"
          docker_image = "${{ steps.config.outputs.docker_image }}"
          environment = "${{ steps.config.outputs.environment }}"
          alert_email = "sakib@shreikglobal.com"
          aws_region = "${{ env.AWS_REGION }}"
          vpc_id = "${{ needs.discover.outputs.vpc_id }}"
          private_subnet_ids = [$(echo '${{ needs.discover.outputs.private_subnets }}' | sed 's/,/","/g' | sed 's/^/"/' | sed 's/$/"/')]
          public_subnet_ids = [$(echo '${{ needs.discover.outputs.public_subnets }}' | sed 's/,/","/g' | sed 's/^/"/' | sed 's/$/"/')]
          EOF

      - name: Terraform init
        working-directory: ${{ steps.template.outputs.template }}
        run: terraform init

      - name: Terraform plan
        working-directory: ${{ steps.template.outputs.template }}
        run: terraform plan

      - name: Terraform apply
        working-directory: ${{ steps.template.outputs.template }}
        run: terraform apply -auto-approve

      - name: Deployment summary
        run: |
          echo "## IDP Onboarding Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | ${{ steps.config.outputs.service_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Template | ${{ steps.config.outputs.template_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Team | ${{ steps.config.outputs.team_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ steps.config.outputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | ${{ steps.config.outputs.docker_image }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Signature | Verified |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | Provisioned |" >> "$GITHUB_STEP_SUMMARY"
